apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-storage-preparer
  namespace: kube-system              # Runs at the cluster administration layer
spec:
  selector:
    matchLabels:
      name: node-storage-preparer
  template:
    metadata:
      labels:
        name: node-storage-preparer
    spec:
      # This ensures the helper script runs as root so it can modify the host disk
      hostPID: true
      hostNetwork: true
      initContainers:
      - name: create-mongodb-dir
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
          # --- THIS IS YOUR SCRIPT THAT AUTOMATES THE DIR CREATION ---
          - |
            echo "Checking and preparing host storage paths..."
            mkdir -p /host/mnt/data/mongodb
            chmod 777 /host/mnt/data/mongodb
            echo "Host directory prepared successfully."
        volumeMounts:
        - name: host-root
          mountPath: /host            # Injects the real EC2 hard drive into the script
      containers:
      - name: pause-container
        image: registry.k8s.io/pause:3.9 # A standard placeholder container that just sleeps
      volumes:
      - name: host-root
        hostPath:
          path: /                     # Points directly to the host machine root directory

