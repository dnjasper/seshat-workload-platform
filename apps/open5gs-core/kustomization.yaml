apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - daemonsets.yaml
  - storageclass-pv.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: open5gs-values
    namespace: default
    files:
      - values.yaml
