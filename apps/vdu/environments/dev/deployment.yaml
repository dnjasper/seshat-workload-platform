apiVersion: apps/v1
kind: Deployment
metadata:
  name: seshat-vdu-deployment
  namespace: default
  labels:
    app: seshat-vdu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seshat-vdu
  template:
    metadata:
      labels:
        app: seshat-vdu
      annotations:
        k8s.v1.cni.cncf.io/networks: telco-data-plane
    spec:
      serviceAccountName: seshat-vdu-sa
      containers:
        - name: seshat-vdu
          #  Total Bullshit!
          image: 468402787427.dkr.ecr.us-east-1.amazonaws.com/seshat_api:latest@sha256:c73ef2ba5aa1418a17b53601aa1b9eb6c1af588e3af2192316bb72ba3d2c03e4 # {"$imagepolicy": "flux-system:seshat-api-latest"}  
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: metrics
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
